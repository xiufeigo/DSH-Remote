# Android 壳 App 构建：复用 android/build.ps1（无 Gradle 手工工具链）。
# ubuntu runner 预装 pwsh 与 Android SDK；JDK 由官方 action 提供，与本地同一套版本要求。
name: android-apk

on:
  push:
    paths:
      - "android/**"
      # WEB-02：APK 内嵌的 res/raw/mobile.js 由 packages/gateway/assets/mobile-web.js
      # 字节级同步（build.ps1），单一源变更也必须触发 Android 构建。
      - "packages/gateway/assets/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17（build.ps1 走 JAVA_HOME）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # runner 预装 Android SDK（ANDROID_HOME 指向 /usr/local/lib/android/sdk）。
      # 不再用 android-actions/setup-android@v3：Node 24 强升后它内部接受 SDK 许可
      # 的步骤会直接崩（2026-09 实测 exit 1），预装 sdkmanager 即够用。
      - name: Android SDK（runner 预装，导出 ANDROID_SDK_ROOT 并把 sdkmanager 加进 PATH）
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: 安装构建所需 SDK 组件
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" >/dev/null
          yes | sdkmanager --licenses >/dev/null || true

      - name: 构建签名 APK（自动下载 frpc android_arm64 打包）
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: pwsh -NoProfile -File ./build.ps1

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-remote-apk
          path: android/dist/dsh-remote.apk
          if-no-files-found: error
