# 与 DSH Desktop 一致：推送 v* tag 即构建并发布 GitHub Release。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17（build.ps1 走 JAVA_HOME）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK（platforms;android-36 + build-tools;35.0.0）
        uses: android-actions/setup-android@v3

      - name: 安装构建所需 SDK 组件
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" >/dev/null
          yes | sdkmanager --licenses >/dev/null || true

      - name: 构建签名 APK
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: pwsh -NoProfile -File ./build.ps1

      - name: 按 tag 重命名产物
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          cp android/dist/dsh-remote.apk "android/dist/dsh-remote-${TAG}.apk"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-remote-apk
          path: android/dist/dsh-remote-*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/dist/dsh-remote-*.apk
